<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KSU MCP Tunnel 管理台</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e8eaef; --dim:#9aa3b2;
    --acc:#4f7cff; --ok:#34c77b; --err:#f0564a; --warn:#f0a020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#7b5cff);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
  h1{font-size:17px;font-weight:700}
  .sub{color:var(--dim);font-size:12px}
  .spacer{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
  .card h2{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  button{appearance:none;border:1px solid var(--line);background:#20242e;color:var(--txt);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
  button:active{transform:scale(.96)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.danger{color:var(--err)}
  button.mini{padding:4px 9px;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input{background:#0d0f13;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
  input:focus{border-color:var(--acc)}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .stat .box{background:#1a1e27;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .box b{display:block;font-size:20px;color:var(--txt)}
  .stat .box span{color:var(--dim);font-size:11.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--dim);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
  td.code{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11.5px;color:#b9c2d0;word-break:break-all;max-width:240px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:5px}
  .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .dot.off{background:var(--err)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{flex:1;min-width:140px}
  pre{background:#0d0f13;border:1px solid var(--line);border-radius:8px;padding:10px;font:11px/1.5 ui-monospace,"SF Mono",Consolas,monospace;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#b9c2d0}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#20242e;border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:86vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--ok);color:var(--ok)}
  .toast.err{border-color:var(--err);color:var(--err)}
  .login-wrap{max-width:340px;margin:12vh auto 0}
  .login-wrap h2{text-align:center;margin-bottom:16px;color:var(--txt)}
  .login-wrap .row{margin-top:10px}
  .hidden{display:none}
  .muted{color:var(--dim);font-size:11.5px}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:20px}
</style>
</head>
<body>

<!-- 登录视图 -->
<div id="loginView" class="login-wrap hidden">
  <h2>🔐 KSU MCP Tunnel 管理台</h2>
  <div class="card">
    <div class="row"><input id="loginUser" placeholder="用户名" value="admin"></div>
    <div class="row"><input id="loginPass" type="password" placeholder="密码"></div>
    <div class="row"><button class="primary" style="width:100%" onclick="doLogin()">登 录</button></div>
    <p class="muted" style="margin-top:10px">默认账号 admin / admin123，登录后请立即修改密码。连续 5 次失败将锁定 10 分钟。</p>
  </div>
</div>

<!-- 主视图 -->
<div id="mainView" class="hidden">
  <header>
    <span class="logo">T</span>
    <div><h1>KSU MCP Tunnel 管理台</h1><div class="sub" id="svcInfo">连接中…</div></div>
    <div class="spacer"><span id="upTime"></span><button class="mini" onclick="logout()">退出</button></div>
  </header>

  <section class="card">
    <h2>运行统计</h2>
    <div class="stat">
      <div class="box"><b id="stDev">-</b><span>设备在线 / 总数</span></div>
      <div class="box"><b id="stReq">-</b><span>转发请求</span></div>
      <div class="box"><b id="stFail">-</b><span>失败请求</span></div>
      <div class="box"><b id="stAct">-</b><span>转发中</span></div>
    </div>
  </section>

  <section class="card">
    <h2>设备管理</h2>
    <div class="row" style="margin-bottom:10px">
      <input id="newDevice" placeholder="新设备名（如 my-phone，字母数字 . _ -）">
      <button class="primary" onclick="addDevice()">添加设备</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>设备</th><th>状态</th><th>远端 IP</th><th>接入时间</th><th>tunnelToken（设备端）</th><th>clientToken（客户端）</th><th>操作</th></tr></thead>
        <tbody id="devBody"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>修改管理密码</h2>
    <div class="row">
      <input id="oldPass" type="password" placeholder="旧密码">
      <input id="newPass" type="password" placeholder="新密码（至少 6 位）">
      <button class="primary" onclick="changePass()">修改</button>
    </div>
  </section>

  <section class="card">
    <h2>运行日志 <span class="tag" id="logCount"></span></h2>
    <pre id="logs">加载中…</pre>
    <div class="row" style="margin-top:8px"><button onclick="loadLogs()">刷新日志</button></div>
  </section>

  <footer>KSU MCP Tunnel Server · WebUI 仅限管理员 · 请通过 HTTPS 访问</footer>
</div>

<div class="toast" id="toast"></div>

<script>
let toastTimer = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = 'toast'), 3000);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const r = await fetch(path, opts);
  let d = null;
  try { d = await r.json(); } catch (e) { /* ignore */ }
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  if (!r.ok || (d && d.ok === false)) throw new Error((d && d.error) || ('HTTP ' + r.status));
  return d;
}

// ---------------- 登录 ----------------
function showLogin() {
  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}
function showMain() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  refreshAll();
  setInterval(refreshStatus, 10000);
}

async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!user || !pass) { toast('请输入用户名和密码', 'err'); return; }
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ username: user, password: pass }) });
    toast('登录成功');
    showMain();
  } catch (e) { toast(String(e.message || e), 'err'); }
}

async function logout() {
  try { await api('/api/logout', { method: 'POST', body: '{}' }); } catch (e) { /* ignore */ }
  showLogin();
}

// ---------------- 状态 ----------------
function fmtDur(ms) {
  if (!ms) return '-';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + '天' + h + '时';
  if (h > 0) return h + '时' + m + '分';
  return m + '分' + (s % 60) + '秒';
}
function fmtTime(t) {
  if (!t) return '-';
  const d = new Date(t);
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

async function refreshStatus() {
  try {
    const st = await api('/api/status');
    document.getElementById('svcInfo').textContent = st.app + ' v' + st.version + ' · 端口 ' + st.port + (st.tls ? ' · TLS' : ' · 无TLS') + ' · 管理员 ' + st.adminUser;
    document.getElementById('upTime').textContent = '已运行 ' + fmtDur(st.uptime);
    document.getElementById('stDev').textContent = st.devices.filter((d) => d.online).length + ' / ' + st.devices.length;
    document.getElementById('stReq').textContent = st.stats.requests;
    document.getElementById('stFail').textContent = st.stats.failures;
    document.getElementById('stAct').textContent = st.stats.active;
    renderDevices(st.devices);
  } catch (e) { /* 保持现状 */ }
}

function renderDevices(devices) {
  const tb = document.getElementById('devBody');
  tb.textContent = '';
  if (!devices.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 7; td.className = 'muted'; td.textContent = '暂无设备，先在上方添加';
    tr.appendChild(td); tb.appendChild(tr);
    return;
  }
  for (const d of devices) {
    const tr = document.createElement('tr');
    const mk = (text) => { const td = document.createElement('td'); td.textContent = text; return td; };
    const mkCode = (text) => { const td = document.createElement('td'); td.className = 'code'; td.textContent = text; return td; };
    const mkBtn = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'mini ' + (cls || ''); b.textContent = label; b.onclick = fn; return b; };

    tr.appendChild(mk(d.device));
    const tdSt = document.createElement('td');
    const dot = document.createElement('span');
    dot.className = 'dot ' + (d.online ? 'on' : 'off');
    tdSt.appendChild(dot);
    tdSt.appendChild(document.createTextNode(d.online ? '在线' : '离线'));
    tr.appendChild(tdSt);
    tr.appendChild(mk(d.remote || '-'));
    tr.appendChild(mk(fmtTime(d.connectedAt)));

    const tdT = document.createElement('td'); tdT.className = 'code';
    tdT.textContent = d.tunnelToken;
    tdT.style.position = 'relative';
    tr.appendChild(tdT);
    tr.appendChild(mkCode(d.clientToken));

    const tdOp = document.createElement('td');
    const btnRow = document.createElement('div');
    btnRow.style.display = 'flex'; btnRow.style.gap = '5px'; btnRow.style.flexWrap = 'wrap';
    btnRow.appendChild(mkBtn('复制T', 'primary', () => copyText(d.tunnelToken, 'tunnelToken 已复制')));
    btnRow.appendChild(mkBtn('复制C', 'primary', () => copyText(d.clientToken, 'clientToken 已复制')));
    btnRow.appendChild(mkBtn('重置', '', () => rotateDev(d.device, 'both')));
    btnRow.appendChild(mkBtn('删除', 'danger', () => delDevice(d.device)));
    tdOp.appendChild(btnRow);
    tr.appendChild(tdOp);
    tb.appendChild(tr);
  }
}

// ---------------- 设备操作 ----------------
async function addDevice() {
  const name = document.getElementById('newDevice').value.trim();
  if (!name) { toast('请输入设备名', 'err'); return; }
  try {
    const d = await api('/api/devices', { method: 'POST', body: JSON.stringify({ device: name }) });
    document.getElementById('newDevice').value = '';
    toast('设备 ' + d.device + ' 已添加');
    refreshStatus();
  } catch (e) { toast(String(e.message || e), 'err'); }
}

async function delDevice(device) {
  if (!confirm('确定删除设备 ' + device + ' ？其在线连接将被断开。')) return;
  try { await api('/api/devices/' + encodeURIComponent(device), { method: 'DELETE' }); toast('已删除 ' + device, 'ok'); refreshStatus(); }
  catch (e) { toast(String(e.message || e), 'err'); }
}

async function rotateDev(device, which) {
  try {
    const d = await api('/api/devices/' + encodeURIComponent(device) + '/rotate', { method: 'POST', body: JSON.stringify({ which }) });
    toast('Token 已重置，设备需用新 tunnelToken 重连', 'ok');
    refreshStatus();
  } catch (e) { toast(String(e.message || e), 'err'); }
}

async function changePass() {
  const oldP = document.getElementById('oldPass').value;
  const newP = document.getElementById('newPass').value;
  if (!oldP || !newP) { toast('请填写新旧密码', 'err'); return; }
  if (newP.length < 6) { toast('新密码至少 6 位', 'err'); return; }
  try {
    await api('/api/password', { method: 'POST', body: JSON.stringify({ old: oldP, new: newP }) });
    document.getElementById('oldPass').value = '';
    document.getElementById('newPass').value = '';
    toast('密码已修改', 'ok');
  } catch (e) { toast(String(e.message || e), 'err'); }
}

// ---------------- 日志 / 复制 ----------------
async function loadLogs() {
  try {
    const d = await api('/api/logs?n=200');
    document.getElementById('logs').textContent = d.logs.length ? d.logs.join('\n') : '(暂无日志)';
    document.getElementById('logCount').textContent = d.logs.length + ' 条';
  } catch (e) { document.getElementById('logs').textContent = '读取失败: ' + (e.message || e); }
}

async function copyText(text, msg) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    ok = document.execCommand('copy'); ta.remove();
  }
  toast(ok ? msg : '复制失败，请手动选择复制', ok ? 'ok' : 'err');
}

function refreshAll() { refreshStatus(); loadLogs(); }

// ---------------- 初始化：探测登录态 ----------------
(async function init() {
  try {
    await api('/api/status');
    showMain();
  } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
